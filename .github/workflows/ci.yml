name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type-check
        run: python -m mypy src
      # Coverage is measured over the whole package, interface included. It
      # used to cover only sclip.contracts and sclip.core, which left the UI
      # layer -- the majority of the code, and the part a user actually touches
      # -- outside the gate entirely.
      - name: Test with coverage
        run: >-
          python -m pytest -m "not slow"
          --cov=sclip
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=67
          -p no:cacheprovider

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run fast suite
        run: python -m pytest -m "not slow" -p no:cacheprovider

  package:
    name: Build wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build frontend
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Verify bundled UI assets
        shell: python
        run: |
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          required = {
              "sclip/ui/assets/fonts/Figtree-Variable.ttf",
              "sclip/ui/assets/fonts/Unbounded-Variable.ttf",
              "sclip/ui/assets/fonts/OFL-Figtree.txt",
              "sclip/ui/assets/fonts/OFL-Unbounded.txt",
              "sclip/ui/assets/icon.png",
              "sclip/ui/assets/icon.svg",
              "sclip/ui/styles.qss",
          }
          with zipfile.ZipFile(wheel) as archive:
              missing = required.difference(archive.namelist())
          if missing:
              raise SystemExit(f"Wheel is missing assets: {sorted(missing)}")
      - uses: actions/upload-artifact@v7
        with:
          name: sclip-dist
          path: dist/*
          if-no-files-found: error
